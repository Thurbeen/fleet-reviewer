# Git hooks, run with prek (https://github.com/j178/prek) rather than the
# Python `pre-commit`:
#
#     prek install
#
# `prek run --all-files` is the repository gate: the publish skill and CI run
# the same checks. Commit messages are checked so local history stays
# readable; the commit that lands on main is the squashed PR title, which CI
# checks in pr-title.yml.
default_stages: [pre-commit]
default_install_hook_types:
  - commit-msg
  - pre-commit

repos:
  # Conventional commit messages, checked by cocogitto against cog.toml, as
  # thurbox does.
  - repo: local
    hooks:
      - id: cocogitto-verify
        name: Verify conventional commit message
        entry: cog verify
        language: system
        stages: [commit-msg]
        args: ['--file']

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: v0.3.2
    hooks:
      - id: rumdl-check

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck

  # The plugin: plain TypeScript that Node.js runs as is. These run the same
  # scripts CI runs.
  - repo: local
    hooks:
      - id: typecheck
        name: typecheck
        entry: pnpm typecheck
        language: system
        pass_filenames: false
        files: \.(ts|json)$
      - id: prettier
        name: prettier
        entry: pnpm fmt:check
        language: system
        pass_filenames: false
        files: \.(ts|json|ya?ml)$
      - id: test
        name: test
        entry: pnpm test
        language: system
        pass_filenames: false
        files: \.(ts|json)$
