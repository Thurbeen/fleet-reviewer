<g font-size="11.5">
<text x="64" y="181" text-anchor="middle">listed</text>
<text x="302" y="172" text-anchor="middle">dispatch</text>
<text x="552" y="172" text-anchor="middle">result</text>
<text x="304" y="220" text-anchor="middle">older head</text>
<text x="428" y="114" text-anchor="middle">new push</text>
<text x="150" y="278" text-anchor="end">filtered</text>
<text x="206" y="278">included</text>
<text x="829" y="181" text-anchor="middle">closed</text>
<text x="829" y="351" text-anchor="middle">retire</text>
<text x="978" y="278">retention</text>
<text x="984" y="442">Tasks gone</text>
</g>
</g>
</svg>
